title: Nemanja
email: nemanjan00@gmail.com
description: >-
  Just a place where I write when I have something geeky to say.
baseurl: ""
url: "https://nemanja.top"
github_username: nemanjan00
permalink: /:categories/:year/:month/:day/:title

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

sass:
  style: compressed

paginate: 5

plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .bundle/
  - .ruby-version
